<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario - Pastelería Mil Sabores</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">Pastelería Mil Sabores</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="header-derecha">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registrarse</a>
      <a class="carrito-icono" href="carrito.html">🛒 <span id="contador-carrito">0</span></a>
    </div>
  </header>

  <main>
    <section>
      <h1 style="text-align:center; margin-top: 30px;">Crear una cuenta</h1>
      <form class="formulario" id="form-registro" novalidate>
        <div class="campo">
          <label for="registro-nombre">Nombre completo</label>
          <input type="text" id="registro-nombre" maxlength="50">
          <span class="mensaje-error" id="error-registro-nombre"></span>
        </div>
        <div class="campo">
          <label for="registro-correo">Correo</label>
          <input type="email" id="registro-correo" maxlength="100" placeholder="tucorreo@duoc.cl">
          <span class="mensaje-error" id="error-registro-correo"></span>
        </div>
        <div class="campo">
          <label for="registro-clave">Contraseña</label>
          <input type="password" id="registro-clave" maxlength="10">
          <span class="mensaje-error" id="error-registro-clave"></span>
        </div>
        <div class="campo">
          <label for="registro-clave-confirmar">Confirmar contraseña</label>
          <input type="password" id="registro-clave-confirmar" maxlength="10">
          <span class="mensaje-error" id="error-registro-clave-confirmar"></span>
        </div>
        <div class="campo">
          <label for="registro-fecha-nacimiento">Fecha de nacimiento</label>
          <input type="date" id="registro-fecha-nacimiento">
          <span class="mensaje-error" id="error-registro-fecha"></span>
        </div>
        <div class="campo">
          <label for="registro-codigo">Código promocional (opcional)</label>
          <input type="text" id="registro-codigo" placeholder="Ej: FELICES50">
          <p style="font-size:0.8rem; color:var(--color-texto-claro); margin-top:4px;">Con el código FELICES50 obtienes 10% de descuento de por vida.</p>
        </div>
        <button type="submit" class="btn">Registrarme</button>
      </form>
    </section>

  </main>
  <footer>
    <p>Pastelería Mil Sabores &copy; 2026 - Celebrando 50 años de tradición</p>
    <p>Síguenos: <a href="#">Instagram</a> · <a href="#">Facebook</a></p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>

</body>
</html>
