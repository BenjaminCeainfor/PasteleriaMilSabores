<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Pastelería Mil Sabores</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">Pastelería Mil Sabores</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="header-derecha">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registrarse</a>
      <a class="carrito-icono" href="carrito.html">🛒 <span id="contador-carrito">0</span></a>
    </div>
  </header>

  <main>
    <section>
      <h1 style="text-align:center; margin-top: 30px;">Contáctanos</h1>
      <form class="formulario" id="form-contacto" novalidate>
        <div class="campo">
          <label for="contacto-nombre">Nombre completo</label>
          <input type="text" id="contacto-nombre" maxlength="100">
          <span class="mensaje-error" id="error-contacto-nombre"></span>
        </div>
        <div class="campo">
          <label for="contacto-correo">Correo (opcional)</label>
          <input type="email" id="contacto-correo" maxlength="100">
          <span class="mensaje-error" id="error-contacto-correo"></span>
        </div>
        <div class="campo">
          <label for="contacto-mensaje">Mensaje</label>
          <textarea id="contacto-mensaje" rows="4" maxlength="500"></textarea>
          <span class="mensaje-error" id="error-contacto-mensaje"></span>
        </div>
        <button type="submit" class="btn">Enviar mensaje</button>
      </form>
    </section>

  </main>
  <footer>
    <p>Pastelería Mil Sabores &copy; 2026 - Celebrando 50 años de tradición</p>
    <p>Síguenos: <a href="#">Instagram</a> · <a href="#">Facebook</a></p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>

</body>
</html>
